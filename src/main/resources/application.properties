spring.application.name=little-law-demo

# --- Base de données (voir docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/littlelaw
spring.datasource.username=littlelaw
spring.datasource.password=littlelaw
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Les deux pools de l'article (valeurs par defaut de Spring Boot, rendues explicites) ---
server.tomcat.threads.max=450
spring.datasource.hikari.maximum-pool-size=30
# Pour voir rapidement les erreurs dans le cas 2, on peut baisser ce timeout (30 s par defaut)
spring.datasource.hikari.connection-timeout=30000

# --- Metriques ---
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Tomcat metrics (tomcat.threads.*) : non publiees par defaut ---
server.tomcat.mbeanregistry.enabled=true
